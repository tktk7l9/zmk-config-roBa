# keymap-drawer config (referenced by draw.yml as config_path)
# Custom hold-taps/macros are drawn with their internal names, so display labels are overridden here.
parse_config:
  raw_binding_map:
    # BTclr long-press key: actually &bt_clr_hold 0 0 (hold = macro bt_clr_macro = &bt BT_CLR).
    # As is, it would be drawn as "&bt_clr_macro", so it is formatted as "BT CLR" (long press).
    "&bt_clr_hold 0 0":
      tap: ""
      hold: "BT CLR"
    # BT profile switch (macro with marker). Actually &bt BT_SEL n + an invisible
    # marker tap (for roba-hud's device management). Displayed as BT n, as before.
    "&bt_sel_m0":
      tap: "BT 0"
    "&bt_sel_m1":
      tap: "BT 1"
